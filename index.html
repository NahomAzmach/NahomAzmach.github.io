<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nahom Azmach</title>
<meta name="description" content="Nahom Azmach: projects, write-ups and thoughts. ML research, tools and websites.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: a quiet lab notebook. Big confident type, a scannable project index,
   and long-form posts that read like a good magazine column. */
:root {
  --bg: #F2F3F0;
  --surface: #FFFFFF;
  --ink: #0F1317;
  --muted: #5A626C;
  --line: #DADDE1;
  --accent: #2F48F5;
  --accent-ink: #FFFFFF;
  --live: #E4572E;
  --code-bg: #10151B;
  --code-ink: #DCE3EA;
  --shadow: 0 1px 2px rgba(15,19,23,.05), 0 12px 32px -12px rgba(15,19,23,.18);
  --font-display: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Newsreader", Georgia, "Times New Roman", serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --wrap: 1180px;
  --radius: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0F13; --surface: #141920; --ink: #E8ECEF; --muted: #98A1AC; --line: #232A33;
    --accent: #8796FF; --accent-ink: #0C0F13; --live: #FF7A52; --code-bg: #0A0D11; --code-ink: #DCE3EA;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px -16px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0F13; --surface: #141920; --ink: #E8ECEF; --muted: #98A1AC; --line: #232A33;
  --accent: #8796FF; --accent-ink: #0C0F13; --live: #FF7A52; --code-bg: #0A0D11; --code-ink: #DCE3EA;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px -16px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-display); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
img { max-width: 100%; display: block; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px); }
.mono { font-family: var(--font-mono); font-size: 12px; letter-spacing: .02em; text-transform: uppercase; color: var(--muted); }

/* ---------- header ---------- */
.top {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid transparent; transition: border-color .3s;
}
.top.scrolled { border-bottom-color: var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 600; letter-spacing: -0.01em; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
  background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 700; letter-spacing: 0;
}
nav.links { display: flex; align-items: center; gap: 4px; }
nav.links a {
  text-decoration: none; padding: 8px 12px; border-radius: 999px; font-size: 15px; color: var(--muted);
  transition: color .2s, background .2s;
}
nav.links a:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 6%, transparent); }
nav.links a[aria-current="page"] { color: var(--ink); background: color-mix(in srgb, var(--ink) 8%, transparent); }
.theme-btn {
  width: 38px; height: 38px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); display: grid; place-items: center; cursor: pointer; margin-left: 6px;
}
.theme-btn svg { width: 17px; height: 17px; }
.progress { position: fixed; top: 0; left: 0; height: 2px; background: var(--accent); width: 0; z-index: 50; transition: width .08s linear; }

/* ---------- view transitions ---------- */
#view { min-height: 70vh; }
.enter { animation: enter .55s cubic-bezier(.2,.7,.2,1) both; }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
::view-transition-old(root) { animation: vt-out .22s ease both; }
::view-transition-new(root) { animation: vt-in .4s cubic-bezier(.2,.7,.2,1) both; }
@keyframes vt-out { to { opacity: 0; } }
@keyframes vt-in { from { opacity: 0; transform: translateY(8px); } }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 999px;
  text-decoration: none; font-family: var(--font-display); font-weight: 500; font-size: 15px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); transition: transform .2s, box-shadow .2s, background .2s;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn svg { width: 15px; height: 15px; }

/* ---------- hero ---------- */
.hero { padding-top: clamp(40px, 7vw, 96px); padding-bottom: clamp(32px, 5vw, 64px); }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 72px); align-items: end; }
.hello { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 22px; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 0 color-mix(in srgb, var(--live) 60%, transparent); animation: pulse 2.4s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 10px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.hero h1 { font-size: clamp(40px, 6.2vw, 82px); line-height: .98; letter-spacing: -0.035em; font-weight: 600; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p.lede { font-family: var(--font-body); font-size: clamp(19px, 1.7vw, 22px); line-height: 1.5; color: var(--muted); max-width: 40ch; margin: 26px 0 30px; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; }
.portrait { position: relative; }
.portrait img { width: 100%; aspect-ratio: 4/5; object-fit: cover; object-position: 50% 22%; border-radius: 22px; box-shadow: var(--shadow); }
.now {
  position: relative; margin: -56px 18px 0; background: var(--surface); border: 1px solid var(--line);
  border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); display: grid; gap: 9px;
}
.now div { display: grid; grid-template-columns: 76px 1fr; gap: 10px; font-size: 14px; line-height: 1.35; }
.now .mono { font-size: 11px; padding-top: 2px; }

/* ---------- marquee ---------- */
.marquee { border-block: 1px solid var(--line); overflow: hidden; padding: 16px 0; margin: 8px 0 0; }
.marquee-track { display: flex; gap: 40px; width: max-content; animation: slide 46s linear infinite; }
.marquee:hover .marquee-track { animation-play-state: paused; }
.marquee span { font-size: clamp(18px, 2vw, 24px); font-weight: 500; letter-spacing: -0.01em; white-space: nowrap; color: var(--muted); display: inline-flex; align-items: center; gap: 40px; }
.marquee span::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: .7; }
@keyframes slide { to { transform: translateX(-50%); } }

/* ---------- sections ---------- */
section.block { padding-top: clamp(48px, 7vw, 96px); }
.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 28px; flex-wrap: wrap; }
.sec-head h2 { font-size: clamp(28px, 3.4vw, 44px); line-height: 1.05; }
.sec-head p { margin: 8px 0 0; color: var(--muted); max-width: 52ch; }

/* featured bento */
.bento { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px; }
.card {
  position: relative; display: flex; flex-direction: column; text-decoration: none; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
  transition: transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s, border-color .35s;
}
.card:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.card .media { aspect-ratio: 16/9; overflow: hidden; background: color-mix(in srgb, var(--ink) 5%, var(--surface)); border-bottom: 1px solid var(--line); }
.card .media img { width: 100%; height: 100%; object-fit: cover; object-position: top center; transition: transform .8s cubic-bezier(.2,.7,.2,1); }
.card:hover .media img { transform: scale(1.035); }
.card .body { padding: 20px 22px 22px; display: grid; gap: 8px; }
.card h3 { font-size: 22px; line-height: 1.15; }
.card p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
.card .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.bento .card:nth-child(1) { grid-column: span 6; }
.bento .card:nth-child(1) { flex-direction: row; }
.bento .card:nth-child(1) .media { flex: 1.45; aspect-ratio: auto; min-height: 340px; border-bottom: 0; border-right: 1px solid var(--line); }
.bento .card:nth-child(1) .body { flex: 1; align-content: center; padding: 34px; }
.bento .card:nth-child(1) h3 { font-size: clamp(28px, 3vw, 40px); }
.bento .card:nth-child(1) p { font-size: 17px; }
.bento .card:nth-child(2), .bento .card:nth-child(3) { grid-column: span 3; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .03em;
  text-transform: uppercase; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--bg);
}
.pill.live { color: var(--live); border-color: color-mix(in srgb, var(--live) 40%, var(--line)); }
.pill.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--live); }

/* project index */
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
  background: transparent; color: var(--muted); cursor: pointer; transition: all .2s;
}
.chip:hover { color: var(--ink); border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .n { font-family: var(--font-mono); font-size: 11px; opacity: .6; margin-left: 4px; }
.index { border-top: 1px solid var(--line); }
.row {
  display: grid; grid-template-columns: 90px minmax(0, 1.1fr) minmax(0, 1.4fr) 140px 28px; gap: 20px; align-items: center;
  padding: 22px 6px; border-bottom: 1px solid var(--line); text-decoration: none; position: relative;
  transition: background .25s, padding .3s cubic-bezier(.2,.7,.2,1);
}
.row:hover { background: var(--surface); padding-left: 16px; padding-right: 16px; }
.row .yr { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.row h3 { font-size: 21px; line-height: 1.2; }
.row p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.4; }
.row .cat { justify-self: start; }
.row .arrow { width: 22px; height: 22px; color: var(--muted); transition: transform .3s, color .3s; }
.row:hover .arrow { transform: translateX(4px); color: var(--accent); }
.row.hidden { display: none; }
.peek {
  position: fixed; z-index: 30; width: 300px; aspect-ratio: 16/10; border-radius: 14px; overflow: hidden; pointer-events: none;
  box-shadow: var(--shadow); border: 1px solid var(--line); background: var(--surface);
  opacity: 0; transform: scale(.92) rotate(-2deg); transition: opacity .25s, transform .35s cubic-bezier(.2,.7,.2,1);
}
.peek.on { opacity: 1; transform: scale(1) rotate(-2deg); }
.peek img, .peek .gen { width: 100%; height: 100%; object-fit: cover; object-position: top; }

/* generated covers for projects without screenshots */
.gen {
  --h: 220; position: relative; width: 100%; height: 100%; min-height: 100%; overflow: hidden;
  background:
    radial-gradient(120% 90% at 0% 0%, hsl(var(--h) 85% 62% / .55), transparent 55%),
    radial-gradient(90% 80% at 100% 100%, hsl(calc(var(--h) + 40) 80% 55% / .45), transparent 60%),
    hsl(var(--h) 30% 12%);
  color: #fff; display: flex; align-items: flex-end; padding: 22px;
}
.gen::before {
  content: ""; position: absolute; inset: 0; opacity: .22;
  background-image: linear-gradient(rgba(255,255,255,.5) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.5) 1px, transparent 1px);
  background-size: 28px 28px; mask-image: linear-gradient(to top, transparent, #000 70%);
}
.gen b { position: relative; font-size: clamp(28px, 4vw, 56px); font-weight: 600; letter-spacing: -0.03em; line-height: .95; }
.gen small { position: absolute; top: 18px; left: 22px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; opacity: .8; }

/* writing list */
.notes { display: grid; gap: 0; border-top: 1px solid var(--line); }
.note { display: grid; grid-template-columns: 140px minmax(0, 1fr) 28px; gap: 20px; padding: 24px 6px; border-bottom: 1px solid var(--line); text-decoration: none; align-items: baseline; transition: background .25s, padding .3s; }
.note:hover { background: var(--surface); padding-inline: 16px; }
.note h3 { font-size: 22px; line-height: 1.2; }
.note p { margin: 6px 0 0; font-family: var(--font-body); font-size: 18px; color: var(--muted); }
.note .arrow { width: 22px; height: 22px; color: var(--muted); align-self: center; }

/* about strip */
.about-strip { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: clamp(24px, 5vw, 64px); align-items: start; }
.about-strip .big { font-size: clamp(24px, 2.6vw, 34px); line-height: 1.2; letter-spacing: -0.02em; font-weight: 500; }
.prose-sm { font-family: var(--font-body); font-size: 19px; line-height: 1.6; color: var(--muted); }
.prose-sm p { margin: 0 0 1em; }

/* ---------- post ---------- */
.post-head { padding-top: clamp(28px, 5vw, 56px); padding-bottom: 28px; }
.back { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--muted); font-size: 15px; margin-bottom: 28px; transition: color .2s, gap .2s; }
.back:hover { color: var(--ink); gap: 12px; }
.back svg { width: 16px; height: 16px; }
.post-head h1 { font-size: clamp(38px, 6vw, 76px); line-height: 1; letter-spacing: -0.035em; max-width: 16ch; }
.post-head .kicker { font-family: var(--font-body); font-size: clamp(20px, 2vw, 25px); line-height: 1.4; color: var(--muted); max-width: 46ch; margin: 18px 0 0; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-block: 1px solid var(--line); margin-top: 34px; }
.facts > div { padding: 16px 16px 16px 0; display: grid; gap: 6px; align-content: start; }
.facts > div + div { padding-left: 16px; border-left: 1px solid var(--line); }
.facts .v { font-size: 15px; line-height: 1.4; }
.post-links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.post-cover { margin: 8px 0 0; border-radius: 22px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); background: var(--surface); }
.post-cover img { width: 100%; max-height: 640px; object-fit: cover; object-position: top center; }
.post-cover .gen { aspect-ratio: 21/8; min-height: 220px; }
.post-grid { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 64px; padding-top: clamp(36px, 5vw, 64px); }
.toc { position: sticky; top: 92px; align-self: start; display: grid; gap: 4px; font-size: 14px; }
.toc .mono { margin-bottom: 8px; }
.toc a { text-decoration: none; color: var(--muted); padding: 5px 0 5px 12px; border-left: 2px solid var(--line); line-height: 1.3; transition: color .2s, border-color .2s; }
.toc a:hover, .toc a.on { color: var(--ink); border-color: var(--accent); }

.prose { font-family: var(--font-body); font-size: 20px; line-height: 1.68; max-width: 68ch; }
.prose > * + * { margin-top: 1.05em; }
.prose p, .prose ul, .prose ol { margin-bottom: 0; }
.prose h2 { font-family: var(--font-display); font-size: clamp(25px, 2.6vw, 32px); line-height: 1.15; margin-top: 2.1em; scroll-margin-top: 90px; }
.prose h3 { font-family: var(--font-display); font-size: 21px; margin-top: 1.6em; }
.prose a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
.prose strong { font-weight: 500; color: var(--ink); background: linear-gradient(transparent 62%, color-mix(in srgb, var(--accent) 18%, transparent) 0); }
.prose ul, .prose ol { padding-left: 1.2em; }
.prose li + li { margin-top: .45em; }
.prose li::marker { color: var(--accent); }
.prose em { font-style: italic; }
.prose blockquote {
  margin: 1.8em 0; padding: 4px 0 4px 24px; border-left: 3px solid var(--accent);
  font-family: var(--font-display); font-size: clamp(22px, 2.3vw, 28px); line-height: 1.3; letter-spacing: -0.015em; font-weight: 500;
}
.prose blockquote p { margin: 0; }
.prose code { font-family: var(--font-mono); font-size: .78em; padding: .15em .4em; border-radius: 6px; background: color-mix(in srgb, var(--ink) 7%, transparent); }
.prose pre {
  position: relative; background: var(--code-bg); color: var(--code-ink); border-radius: 14px; padding: 20px 22px; overflow-x: auto;
  font-size: 14px; line-height: 1.6; margin: 1.6em 0; border: 1px solid color-mix(in srgb, #fff 6%, transparent);
}
.prose pre code { background: none; padding: 0; font-size: 13.5px; color: inherit; }
.copy {
  position: absolute; top: 10px; right: 10px; font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: .05em;
  color: #9AA6B2; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 8px; padding: 5px 9px; cursor: pointer; opacity: 0; transition: opacity .2s;
}
.prose pre:hover .copy, .copy:focus-visible { opacity: 1; }
.hljs-keyword, .hljs-built_in, .hljs-type { color: #9DB1FF; }
.hljs-string, .hljs-regexp { color: #B8E58C; }
.hljs-comment { color: #6D7987; font-style: italic; }
.hljs-number, .hljs-literal { color: #FFB86B; }
.hljs-title, .hljs-title.function_ { color: #7FD8E8; }
.hljs-params, .hljs-variable, .hljs-attr { color: #E6D3A3; }
.hljs-meta { color: #C59BFF; }
.prose figure { margin: 2em 0; }
.prose figure img { width: 100%; border-radius: 14px; border: 1px solid var(--line); cursor: zoom-in; background: var(--surface); }
.prose figcaption { font-family: var(--font-display); font-size: 14px; color: var(--muted); margin-top: 10px; line-height: 1.45; }
.prose table { width: 100%; border-collapse: collapse; font-family: var(--font-display); font-size: 15px; line-height: 1.45; display: block; overflow-x: auto; }
.prose th, .prose td { text-align: left; padding: 11px 14px 11px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.prose th { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 500; }
.prose td { font-variant-numeric: tabular-nums; }
.prose td em { font-family: var(--font-body); font-size: 16px; }
.prose .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 2em 0; font-family: var(--font-display); }
.prose .stats > div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 6px; }
.prose .stats b { font-size: clamp(26px, 3vw, 34px); font-weight: 600; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.prose .stats span { font-size: 14px; line-height: 1.35; color: var(--muted); }
.prose .flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 1.8em 0; font-family: var(--font-display); counter-reset: step; }
.prose .flow > div { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 4px; counter-increment: step; }
.prose .flow > div::before { content: "0" counter(step); font-family: var(--font-mono); font-size: 11px; color: var(--accent); }
.prose .flow b { font-weight: 600; font-size: 17px; }
.prose .flow span { font-size: 14px; color: var(--muted); line-height: 1.35; }
.prose .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.prose .pair figure { margin: 0; }

.next { margin-top: clamp(56px, 8vw, 96px); display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.next a { display: grid; gap: 8px; padding: 24px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); text-decoration: none; transition: transform .3s, box-shadow .3s; }
.next a:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.next a:last-child { text-align: right; }
.next b { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }

/* about page */
.about-hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 72px); padding-top: clamp(36px, 6vw, 80px); align-items: start; }
.about-hero h1 { font-size: clamp(40px, 6vw, 76px); line-height: .98; letter-spacing: -0.035em; }
.about-hero img { border-radius: 22px; aspect-ratio: 4/5; object-fit: cover; object-position: 50% 22%; width: 100%; box-shadow: var(--shadow); }
.timeline { display: grid; border-top: 1px solid var(--line); }
.timeline > div { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 20px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.timeline b { font-weight: 600; font-size: 18px; }
.timeline p { margin: 4px 0 0; color: var(--muted); font-family: var(--font-body); font-size: 17px; line-height: 1.5; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(28px, 5vw, 64px); }
.outside { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.outside li { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; font-family: var(--font-body); font-size: 18px; line-height: 1.45; }

/* footer */
footer { margin-top: clamp(72px, 10vw, 128px); border-top: 1px solid var(--line); padding: 48px 0 56px; }
.foot { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 32px; align-items: end; }
.foot h2 { font-size: clamp(30px, 4vw, 52px); line-height: 1; letter-spacing: -0.035em; }
.foot h2 a { color: var(--accent); text-decoration: none; }
.foot h2 a:hover { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 2px; }
.foot .contacts { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
.foot .small { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 28px; }

/* lightbox */
.lightbox { position: fixed; inset: 0; z-index: 60; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); display: grid; place-items: center; padding: 4vw; opacity: 0; pointer-events: none; transition: opacity .25s; cursor: zoom-out; }
.lightbox.on { opacity: 1; pointer-events: auto; }
.lightbox img { max-height: 90vh; width: auto; border-radius: 14px; box-shadow: var(--shadow); transform: scale(.97); transition: transform .3s; }
.lightbox.on img { transform: none; }

.loading { padding: 120px 0; color: var(--muted); }
.reveal { animation: enter .7s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 60ms); }

/* ---------- responsive ---------- */
@media (max-width: 980px) {
  .post-grid { grid-template-columns: minmax(0, 1fr); }
  .toc { display: none; }
  .row { grid-template-columns: 70px minmax(0, 1fr) 28px; }
  .row p, .row .cat { display: none; }
  .peek { display: none; }
}
@media (max-width: 820px) {
  .hero-grid, .about-hero, .about-strip, .two, .foot { grid-template-columns: minmax(0, 1fr); }
  .portrait { max-width: 420px; }
  .bento .card:nth-child(1) { flex-direction: column; }
  .bento .card:nth-child(1) .media { min-height: 0; aspect-ratio: 16/9; border-right: 0; border-bottom: 1px solid var(--line); }
  .bento .card:nth-child(1) .body { padding: 22px; }
  .bento .card:nth-child(2), .bento .card:nth-child(3) { grid-column: span 6; }
  .facts { grid-template-columns: 1fr 1fr; }
  .facts > div:nth-child(3) { padding-left: 0; border-left: 0; }
  .facts > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .prose .flow { grid-template-columns: 1fr 1fr; }
  .foot .contacts { justify-content: flex-start; }
  .note { grid-template-columns: minmax(0, 1fr) 24px; }
  .note .mono { grid-column: 1 / -1; }
}
@media (max-width: 520px) {
  nav.links a { padding: 8px 9px; font-size: 14px; }
  .brand span:last-child { display: none; }
  .prose { font-size: 18.5px; }
  .prose .pair { grid-template-columns: 1fr; }
  .timeline > div { grid-template-columns: 1fr; gap: 4px; }
  .next { grid-template-columns: 1fr; }
  .next a:last-child { text-align: left; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<header class="top" id="top">
  <div class="wrap">
    <a class="brand" href="#home" aria-label="Nahom Azmach, home"><span class="brand-mark">NA</span><span>Nahom Azmach</span></a>
    <nav class="links" aria-label="Main">
      <a href="#work" data-nav="work">Work</a>
      <a href="#writing" data-nav="writing">Writing</a>
      <a href="#about" data-nav="about">About</a>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch color theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
    </nav>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<footer>
  <div class="wrap foot">
    <div>
      <p class="mono" style="margin:0 0 14px">Say hi</p>
      <h2>Building something with messy data? <a href="mailto:nazmach66@gmail.com">Let's talk.</a></h2>
    </div>
    <div class="contacts">
      <a class="btn" href="mailto:nazmach66@gmail.com">nazmach66@gmail.com</a>
      <a class="btn" href="https://github.com/NahomAzmach">GitHub</a>
      <a class="btn" href="https://www.linkedin.com/in/nahom-azmach">LinkedIn</a>
    </div>
    <div class="small mono"><span>© <span id="yr"></span> Nahom Azmach</span><span>Made by hand, mostly</span></div>
  </div>
</footer>

<div class="peek" id="peek" aria-hidden="true"></div>
<div class="lightbox" id="lightbox" role="dialog" aria-label="Image preview"><img alt=""></div>

<script src="content.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(() => {
  const S = window.SITE, P = window.PROJECTS, T = window.THOUGHTS, A = window.ABOUT;
  const view = document.getElementById('view');
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const arrow = '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const ext = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>';
  const back = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>';
  const fmtDate = (d) => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  document.getElementById('yr').textContent = new Date().getFullYear();

  /* ---------- theme ---------- */
  const root = document.documentElement;
  try { const t = localStorage.getItem('na-theme'); if (t) root.dataset.theme = t; } catch (e) {}
  document.getElementById('themeBtn').addEventListener('click', () => {
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('na-theme', root.dataset.theme); } catch (e) {}
  });

  /* ---------- shared bits ---------- */
  const media = (p, cls = '') => p.cover
    ? `<img src="${p.cover}" alt="${esc(p.title)} screenshot" loading="lazy" class="${cls}">`
    : `<div class="gen ${cls}" style="--h:${p.hue}"><small>${esc(p.stack.slice(0, 3).join(' · '))}</small><b>${esc(p.title)}</b></div>`;
  const statusPill = (p) => `<span class="pill ${p.status === 'Live' ? 'live' : ''}">${esc(p.status)}</span>`;

  const card = (p, i) => `
    <a class="card reveal" style="--i:${i}" href="#${p.slug}">
      <div class="media">${media(p)}</div>
      <div class="body">
        <div class="meta">${statusPill(p)}<span class="pill">${esc(p.category)}</span><span class="mono">${esc(p.year)}</span></div>
        <h3>${esc(p.title)}</h3>
        <p>${esc(p.kicker)}</p>
      </div>
    </a>`;

  const indexRows = (list) => list.map((p, i) => `
    <a class="row reveal" style="--i:${Math.min(i, 8)}" href="#${p.slug}" data-cat="${esc(p.category)}" data-slug="${p.slug}">
      <span class="yr">${esc(p.year)}</span>
      <h3>${esc(p.title)}</h3>
      <p>${esc(p.kicker)}</p>
      <span class="cat">${statusPill(p)}</span>
      ${arrow}
    </a>`).join('');

  const projectIndex = () => {
    const cats = ['All', ...new Set(P.map(p => p.category))];
    const count = (c) => c === 'All' ? P.length : P.filter(p => p.category === c).length;
    return `
      <div class="sec-head">
        <div><h2>Everything</h2><p>Every project with a finished build or a real idea behind it. Each one has a write-up.</p></div>
        <div class="filters" role="group" aria-label="Filter projects">
          ${cats.map((c, i) => `<button class="chip" type="button" data-filter="${c}" aria-pressed="${i === 0}">${c}<span class="n">${count(c)}</span></button>`).join('')}
        </div>
      </div>
      <div class="index" id="index">${indexRows(P)}</div>`;
  };

  const notesList = (list) => `<div class="notes">${list.map((t, i) => `
    <a class="note reveal" style="--i:${i}" href="#note-${t.slug}">
      <span class="mono">${fmtDate(t.date)}</span>
      <div><h3>${esc(t.title)}</h3><p>${esc(t.summary)}</p></div>
      ${arrow}
    </a>`).join('')}</div>`;

  /* ---------- views ---------- */
  function home() {
    const feat = P.filter(p => p.featured);
    const topics = ['traffic cameras', 'satellite embeddings', 'Hausa speech', 'building energy', 'mouse brains', 'phishing emails', 'teff prices', 'job boards', 'church archives', 'IR spectra'];
    const strip = topics.map(t => `<span>${t}</span>`).join('');
    return `
    <section class="hero wrap">
      <div class="hero-grid">
        <div class="reveal">
          <div class="hello"><span class="pulse"></span><span class="mono">${esc(S.role)} · ${esc(S.location)}</span></div>
          <h1>I build tools that turn <em>messy real-world data</em> into something people can actually use.</h1>
          <p class="lede">${esc(S.intro)}</p>
          <div class="cta">
            <a class="btn primary" href="#work">See the work ${arrow.replace('class="arrow"', '')}</a>
            <a class="btn" href="#about">About me</a>
            <a class="btn" href="${S.github}">GitHub ${ext}</a>
          </div>
        </div>
        <div class="portrait reveal" style="--i:2">
          <img src="assets/img/me.webp" alt="Portrait of Nahom Azmach">
          <div class="now">${S.now.map(n => `<div><span class="mono">${esc(n.label)}</span><span>${esc(n.value)}</span></div>`).join('')}</div>
        </div>
      </div>
    </section>
    <div class="marquee" aria-label="Things I've worked with"><div class="marquee-track">${strip}${strip}</div></div>
    <section class="block wrap">
      <div class="sec-head"><div><h2>Selected work</h2><p>Three projects I'd start with if we only had five minutes.</p></div></div>
      <div class="bento">${feat.map(card).join('')}</div>
    </section>
    <section class="block wrap">${projectIndex()}</section>
    <section class="block wrap">
      <div class="sec-head"><div><h2>Writing</h2><p>Thoughts that came out of building things. Short, honest, sometimes wrong.</p></div><a class="btn" href="#writing">All writing</a></div>
      ${notesList(T.slice(0, 3))}
    </section>
    <section class="block wrap">
      <div class="about-strip">
        <p class="big">CS and AI/ML at UW, with minors in biology and chemistry, which is why so much of my work lands between code and science.</p>
        <div class="prose-sm"><p>${esc(A.paragraphs[1])}</p><a class="btn" href="#about">More about me</a></div>
      </div>
    </section>`;
  }

  function work() {
    return `
    <section class="wrap post-head reveal">
      <p class="mono">${P.length} projects · 2023 to now</p>
      <h1 style="max-width:14ch">Work, with the stories behind it.</h1>
      <p class="kicker">Research, tools I use every day, sites for real clients, and the early projects that taught me how computers work.</p>
    </section>
    <section class="wrap"><div class="bento" style="margin-bottom:56px">${P.filter(p => p.featured).map(card).join('')}</div>${projectIndex()}</section>`;
  }

  function writing() {
    return `
    <section class="wrap post-head reveal">
      <p class="mono">Writing · ${T.length} ${T.length === 1 ? 'note' : 'notes'}</p>
      <h1 style="max-width:14ch">Thoughts, in progress.</h1>
      <p class="kicker">Lessons from building things, ideas I'm chewing on, and the occasional strong opinion.</p>
    </section>
    <section class="wrap">${notesList(T)}</section>`;
  }

  function about() {
    return `
    <section class="wrap about-hero">
      <div class="reveal">
        <p class="mono">About</p>
        <h1>Hi, I'm Nahom.</h1>
        <div class="prose" style="margin-top:28px">${A.paragraphs.map(p => `<p>${esc(p)}</p>`).join('')}</div>
        <div class="cta" style="margin-top:28px">
          <a class="btn primary" href="mailto:${S.email}">Email me</a>
          <a class="btn" href="${S.linkedin}">LinkedIn ${ext}</a>
          <a class="btn" href="${S.github}">GitHub ${ext}</a>
        </div>
      </div>
      <div class="reveal" style="--i:2"><img src="assets/img/me-alt.webp" alt="Nahom Azmach smiling outdoors"></div>
    </section>
    <section class="block wrap">
      <div class="sec-head"><h2>Experience</h2></div>
      <div class="timeline">${A.experience.map(e => `<div><span class="mono">${esc(e.when)}</span><div><b>${esc(e.what)}</b><p>${esc(e.detail)}</p></div></div>`).join('')}</div>
    </section>
    <section class="block wrap two">
      <div>
        <div class="sec-head"><h2>Education</h2></div>
        <div class="timeline">${A.education.map(e => `<div><span class="mono">${esc(e.when)}</span><div><b>${esc(e.what)}</b><p>${esc(e.detail)}</p></div></div>`).join('')}</div>
      </div>
      <div>
        <div class="sec-head"><h2>Outside of code</h2></div>
        <ul class="outside">${A.outside.map(o => `<li>${esc(o)}</li>`).join('')}</ul>
      </div>
    </section>`;
  }

  async function project(p) {
    const i = P.indexOf(p);
    const prev = P[(i - 1 + P.length) % P.length], next = P[(i + 1) % P.length];
    view.innerHTML = `
    <section class="wrap post-head reveal">
      <a class="back" href="#work">${back} All work</a>
      <h1>${esc(p.title)}</h1>
      <p class="kicker">${esc(p.kicker)}</p>
      <div class="facts">
        <div><span class="mono">Year</span><span class="v">${esc(p.year)}</span></div>
        <div><span class="mono">Type</span><span class="v">${esc(p.category)}</span></div>
        <div><span class="mono">Status</span><span class="v">${statusPill(p)}</span></div>
        <div><span class="mono">Built with</span><span class="v">${esc(p.stack.join(', '))}</span></div>
      </div>
      <div class="post-links">${p.links.map(l => `<a class="btn" href="${l.url}">${esc(l.label)} ${ext}</a>`).join('')}</div>
    </section>
    <div class="wrap reveal" style="--i:1"><div class="post-cover">${media(p)}</div></div>
    <div class="wrap post-grid">
      <article class="prose" id="article"><p class="loading">Loading the write-up…</p></article>
      <aside class="toc" id="toc"></aside>
    </div>
    <div class="wrap next">
      <a href="#${prev.slug}"><span class="mono">← Previous</span><b>${esc(prev.title)}</b></a>
      <a href="#${next.slug}"><span class="mono">Next →</span><b>${esc(next.title)}</b></a>
    </div>`;
    await fillArticle(`posts/${p.slug}.md`);
  }

  async function note(t) {
    const i = T.indexOf(t);
    const other = T[(i + 1) % T.length];
    view.innerHTML = `
    <section class="wrap post-head reveal">
      <a class="back" href="#writing">${back} All writing</a>
      <p class="mono">${fmtDate(t.date)}</p>
      <h1 style="max-width:20ch;font-size:clamp(36px,5vw,64px)">${esc(t.title)}</h1>
      <p class="kicker">${esc(t.summary)}</p>
    </section>
    <div class="wrap post-grid" style="padding-top:12px">
      <article class="prose" id="article"><p class="loading">Loading…</p></article>
      <aside class="toc" id="toc"></aside>
    </div>
    ${T.length > 1 ? `<div class="wrap next"><a href="#writing"><span class="mono">← Back</span><b>All writing</b></a><a href="#note-${other.slug}"><span class="mono">Read next →</span><b>${esc(other.title)}</b></a></div>` : ''}`;
    await fillArticle(`thoughts/${t.slug}.md`);
  }

  async function fillArticle(path) {
    const el = $('#article');
    let md;
    try {
      const r = await fetch(path);
      if (!r.ok) throw new Error(r.status);
      md = await r.text();
    } catch (e) {
      el.innerHTML = `<p>This write-up couldn't load (${esc(path)}). If you're opening the site straight from your files, run a small local server instead, for example <code>python -m http.server</code>.</p>`;
      return;
    }
    el.innerHTML = marked.parse(md, { gfm: true });
    // images → figures with captions
    el.querySelectorAll('img').forEach(img => {
      img.loading = 'lazy';
      const fig = document.createElement('figure');
      const cap = img.getAttribute('alt');
      const host = img.parentElement;
      fig.appendChild(img.cloneNode());
      if (cap) { const fc = document.createElement('figcaption'); fc.textContent = cap; fig.appendChild(fc); }
      if (host.tagName === 'P' && host.childNodes.length === 1) host.replaceWith(fig); else img.replaceWith(fig);
    });
    // external links
    el.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
    // code: highlight + copy
    el.querySelectorAll('pre code').forEach(code => {
      if (window.hljs) { try { hljs.highlightElement(code); } catch (e) {} }
      const b = document.createElement('button');
      b.className = 'copy'; b.type = 'button'; b.textContent = 'Copy';
      b.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(code.innerText); b.textContent = 'Copied'; }
        catch (e) { b.textContent = 'Select & copy'; }
        setTimeout(() => (b.textContent = 'Copy'), 1600);
      });
      code.parentElement.appendChild(b);
    });
    // table of contents
    const hs = [...el.querySelectorAll('h2')];
    const toc = $('#toc');
    if (hs.length > 1) {
      hs.forEach((h, i) => (h.id = 'sec' + i));
      toc.innerHTML = `<span class="mono">On this page</span>` + hs.map((h, i) => `<a href="#" data-to="sec${i}">${esc(h.textContent)}</a>`).join('');
      toc.querySelectorAll('a').forEach(a => a.addEventListener('click', (e) => {
        e.preventDefault(); document.getElementById(a.dataset.to).scrollIntoView({ behavior: 'smooth' });
      }));
      const links = [...toc.querySelectorAll('a')];
      const io = new IntersectionObserver((ents) => {
        ents.forEach(en => { if (en.isIntersecting) links.forEach(l => l.classList.toggle('on', l.dataset.to === en.target.id)); });
      }, { rootMargin: '-20% 0px -70% 0px' });
      hs.forEach(h => io.observe(h));
    }
  }

  /* ---------- behaviors ---------- */
  function wireIndex() {
    const idx = $('#index');
    if (!idx) return;
    document.querySelectorAll('[data-filter]').forEach(btn => btn.addEventListener('click', () => {
      document.querySelectorAll('[data-filter]').forEach(b => b.setAttribute('aria-pressed', b === btn));
      const f = btn.dataset.filter;
      idx.querySelectorAll('.row').forEach((r, i) => {
        const show = f === 'All' || r.dataset.cat === f;
        r.classList.toggle('hidden', !show);
        if (show) { r.classList.remove('reveal'); void r.offsetWidth; r.classList.add('reveal'); }
      });
    }));
    // floating preview on hover
    const peek = document.getElementById('peek');
    if (!matchMedia('(hover: hover)').matches) return;
    idx.querySelectorAll('.row').forEach(r => {
      const p = P.find(x => x.slug === r.dataset.slug);
      r.addEventListener('mouseenter', () => { peek.innerHTML = media(p); peek.classList.add('on'); });
      r.addEventListener('mouseleave', () => peek.classList.remove('on'));
      r.addEventListener('mousemove', (e) => {
        const x = Math.min(e.clientX + 28, innerWidth - 320), y = Math.min(e.clientY - 90, innerHeight - 200);
        peek.style.left = x + 'px'; peek.style.top = Math.max(76, y) + 'px';
      });
    });
  }

  const lb = document.getElementById('lightbox');
  document.addEventListener('click', (e) => {
    const img = e.target.closest('.prose figure img');
    if (img) { lb.querySelector('img').src = img.src; lb.querySelector('img').alt = img.alt; lb.classList.add('on'); }
  });
  lb.addEventListener('click', () => lb.classList.remove('on'));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') lb.classList.remove('on'); });

  const prog = document.getElementById('progress'), top = document.getElementById('top');
  addEventListener('scroll', () => {
    top.classList.toggle('scrolled', scrollY > 8);
    const art = document.getElementById('article');
    if (!art) { prog.style.width = 0; return; }
    const r = art.getBoundingClientRect();
    const pct = Math.min(1, Math.max(0, -r.top / (r.height - innerHeight * .6)));
    prog.style.width = (pct * 100) + '%';
  }, { passive: true });

  /* ---------- router (plain #name hashes) ---------- */
  async function render() {
    const h = decodeURIComponent(location.hash.slice(1));
    document.getElementById('peek').classList.remove('on');
    let navKey = '';
    const proj = P.find(p => p.slug === h);
    const nt = h.startsWith('note-') && T.find(t => t.slug === h.slice(5));
    if (proj) { navKey = 'work'; document.title = `${proj.title} · Nahom Azmach`; await project(proj); }
    else if (nt) { navKey = 'writing'; document.title = `${nt.title} · Nahom Azmach`; await note(nt); }
    else if (h === 'work') { navKey = 'work'; document.title = 'Work · Nahom Azmach'; view.innerHTML = work(); }
    else if (h === 'writing') { navKey = 'writing'; document.title = 'Writing · Nahom Azmach'; view.innerHTML = writing(); }
    else if (h === 'about') { navKey = 'about'; document.title = 'About · Nahom Azmach'; view.innerHTML = about(); }
    else { document.title = 'Nahom Azmach'; view.innerHTML = home(); }
    document.querySelectorAll('[data-nav]').forEach(a => { if (a.dataset.nav === navKey) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    wireIndex();
  }
  function go() {
    window.scrollTo({ top: 0, behavior: 'instant' });
    if (document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.startViewTransition(render);
    else render();
  }
  addEventListener('hashchange', go);
  render();
})();
</script>
</body>
</html>
